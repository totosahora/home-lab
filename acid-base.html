<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>酸碱变色魔法</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#fdf3e3; }
  #stage { position:absolute; inset:0; touch-action:none; display:block; }
  #scorebar {
    position:absolute; top:12px; left:50%; transform:translateX(-50%);
    background:rgba(70,40,90,0.85); color:#ffd54a; padding:10px 22px;
    border-radius:24px; font-size:18px; font-weight:bold; z-index:10;
    pointer-events:none; white-space:nowrap;
  }
  #hint {
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    background:rgba(70,40,90,0.85); color:#fff; padding:9px 20px;
    border-radius:24px; font-size:15px; z-index:10; cursor:pointer;
    transition:opacity 0.6s; white-space:nowrap; max-width:92vw;
  }
  #winPanel {
    position:absolute; inset:0; z-index:20; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:20px;
    background:rgba(40,20,60,0.55);
  }
  #winPanel .msg {
    font-size:30px; font-weight:bold; color:#ffd54a; line-height:1.7;
    text-shadow:0 3px 8px rgba(0,0,0,0.6); text-align:center; padding:0 20px;
  }
  #winPanel .msg small { font-size:19px; color:#fff; font-weight:normal; }
  #winPanel button {
    font-size:22px; font-weight:bold; padding:14px 34px;
    border-radius:30px; border:none; background:#ffd54a; color:#5a3d00;
    cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.4);
  }
  #winPanel button:active { transform:scale(1.06); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="scorebar">⭐ 0 · 已测 0 / 6</div>
<div id="hint">先点杯子下面的卡片猜一猜，再拖滴管滴进杯子里！</div>
<div id="winPanel">
  <div class="msg"></div>
  <button id="replayBtn">再玩一次</button>
</div>

<script>
"use strict";
/* ================= 基础 ================= */
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const scorebar = document.getElementById("scorebar");
const hintEl = document.getElementById("hint");
const winPanel = document.getElementById("winPanel");
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  computeLayout();
}
window.addEventListener("resize", resize);

/* ================= 场景数据 ================= */
// 紫甘蓝指示剂：酸→红/粉，碱→蓝/绿，中性→保持紫色
const TYPE_TXT = { acid:"酸", base:"碱", neutral:"中性" };
const TYPE_COLOR = { acid:"#e0435a", base:"#3d8bd9", neutral:"#8e6bbf" };
const RECIPES = [
  { name:"白醋",     emoji:"🍶", type:"acid",    target:"#d81b60", init:"#e9f4f4" },
  { name:"柠檬汁",   emoji:"🍋", type:"acid",    target:"#f06292", init:"#f6f2d2" },
  { name:"雪碧汽水", emoji:"🥤", type:"acid",    target:"#f8bbd0", init:"#e9f4f4", soda:true }, // 弱酸→浅粉
  { name:"肥皂水",   emoji:"🧼", type:"base",    target:"#26a69a", init:"#f1f1ea" },
  { name:"小苏打水", emoji:"🥛", type:"base",    target:"#42a5f5", init:"#edf3f6" },
  { name:"纯净水",   emoji:"💧", type:"neutral", target:"#8e6bbf", init:"#e9f4f4" }
];
let cups = [];          // {name,emoji,type,init,target,cx,top,cw,bw,ch, guess,tested,mix,mixing,blobs,bubbles,btnRects}
let stars = 0, testedCount = 0;
let particles = [];     // 星星礼花
let anim = null;        // 滴液动画 {cup, phase, t, fx, fy, drops, spawned}
const INDICATOR = "#7b4ba8";  // 指示剂紫色

function resetGame() {
  const list = RECIPES.slice();
  for (let i = list.length - 1; i > 0; i--) {   // 每次洗牌，位置不同
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  cups = list.map(r => ({
    name:r.name, emoji:r.emoji, type:r.type, init:r.init, target:r.target, soda:!!r.soda,
    cx:0, top:0, cw:0, bw:0, ch:0,
    guess:null, tested:false, mix:0, mixing:false,
    blobs:[], bubbles:[], bubT:Math.random(), btnRects:[]
  }));
  stars = 0; testedCount = 0; particles = []; anim = null;
  dropper.dragging = false;
  winPanel.style.display = "none";
  computeLayout();
  updateScore();
}
function updateScore() { scorebar.textContent = `⭐ ${stars} · 已测 ${testedCount} / ${cups.length}`; }

/* ================= 布局 ================= */
let cols = 6, rows = 1;
const bottle = { x:90, y:96 };
const dropper = { x:0, y:0, hx:0, hy:0, dragging:false, squeeze:0, tilt:0, lastX:0 };
const DROPPER_LEN = 112;   // 球泡顶部到滴管尖

function computeLayout() {
  if (!cups.length) return;
  cols = W >= 780 ? 6 : 3;
  rows = Math.ceil(cups.length / cols);
  const cellW = W / cols;
  // 宽屏：一行 6 杯，瓶子放左下桌面；窄屏：两行 3 杯，底部留出瓶子条
  const availTop = rows === 1 ? H * 0.30 : 150;
  const availBot = rows === 1 ? H - 84 : H - 205;
  const rowGap = rows === 1 ? 116 : 112;
  let ch = Math.min(rows === 1 ? 180 : 165, ((availBot - availTop) - (rows - 1) * rowGap - rows * 76) / rows);
  ch = Math.max(rows === 1 ? 118 : 88, ch);
  cups.forEach((c, i) => {
    const r = Math.floor(i / cols), col = i % cols;
    c.cx = cellW * (col + 0.5);
    c.top = availTop + r * (ch + rowGap);
    c.ch = ch;
    c.cw = Math.min(150, cellW * 0.62);
    c.bw = c.cw * 0.78;
    // 猜测卡按钮：酸 / 碱 / 中性
    const bw1 = Math.min(56, c.cw * 0.36), bh = 42, gap = 8;
    const ws = [bw1, bw1, bw1 + 20];
    const totalW = ws[0] + ws[1] + ws[2] + gap * 2;
    let bx = c.cx - totalW / 2;
    const by = c.top + c.ch + 30;
    c.btnRects = [["acid", ws[0]], ["base", ws[1]], ["neutral", ws[2]]].map(([g, w]) => {
      const rect = { x:bx, y:by, w, h:bh, g };
      bx += w + gap;
      return rect;
    });
  });
  // 指示剂瓶（底部桌面条，避开杯子与提示条）
  bottle.x = rows === 1 ? Math.max(120, W * 0.16) : Math.max(110, W * 0.22);
  bottle.y = rows === 1 ? H - 195 : H - 172;
  dropper.hx = bottle.x + 78;
  dropper.hy = bottle.y - 6;
  if (!dropper.dragging && !anim) { dropper.x = dropper.hx; dropper.y = dropper.hy; }
}

// 杯内坐标辅助
function cupHalfW(c, y) {  // 液面高度 y 处杯子的半宽
  const k = Math.max(0, Math.min(1, (y - c.top) / c.ch));
  return c.cw / 2 + (c.bw / 2 - c.cw / 2) * k;
}
function surfaceY(c) { return c.top + c.ch * 0.30; }
function pointInCup(x, y, c) {
  return y >= c.top - 10 && y <= c.top + c.ch && Math.abs(x - c.cx) < cupHalfW(c, Math.max(y, c.top)) + 12;
}
function cupAt(x, y) {
  for (let i = 0; i < cups.length; i++) if (pointInCup(x, y, cups[i])) return i;
  return -1;
}

/* ================= 颜色工具 ================= */
function hexRGB(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mixColor(a, b, k) {
  const A = hexRGB(a), B = hexRGB(b);
  return `rgb(${Math.round(A[0] + (B[0] - A[0]) * k)},${Math.round(A[1] + (B[1] - A[1]) * k)},${Math.round(A[2] + (B[2] - A[2]) * k)})`;
}
const lerp = (a, b, k) => a + (b - a) * k;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

/* ================= 交互 ================= */
function guessCup(i, g) {
  const c = cups[i];
  if (c.tested) return;
  c.guess = g;
  pop(g === "acid" ? 660 : g === "base" ? 520 : 590);
  showHint(`你猜「${c.name}」是${TYPE_TXT[g]}，拖滴管滴一滴验证吧！`);
}

function startDrop(i) {
  if (anim) return false;
  const c = cups[i];
  if (c.tested) { showHint("这杯已经测过啦，换一杯试试！"); pop(280); return false; }
  if (!c.guess) { showHint(`先点下面的卡片，猜猜「${c.name}」是酸、碱还是中性！`); pop(280); return false; }
  anim = { cup:c, phase:"go", t:0, fx:dropper.x, fy:dropper.y, drops:[], spawned:0 };
  pop(700);
  return true;
}

function resolveDrop(c) {
  c.tested = true;
  testedCount++;
  const right = c.guess === c.type;
  if (right) {
    stars++;
    burst(c.cx, c.top + c.ch * 0.4);
    chime();
    showHint(`猜对啦！「${c.name}」是${TYPE_TXT[c.type]} ⭐+1`);
  } else {
    tone(300, 0.25, 0.08, "sine", 220);
    showHint(`原来「${c.name}」是${TYPE_TXT[c.type]}！记住这个颜色哦`);
  }
  updateScore();
  if (testedCount >= cups.length) {
    setTimeout(showSummary, 1500);
  }
}

function showSummary() {
  winPanel.querySelector(".msg").innerHTML =
    `🎉 全部测完啦！猜对 ${stars} / ${cups.length} 次<br>` +
    `<small>🔴 变红、变粉的都是「酸」——白醋、柠檬汁、雪碧<br>` +
    `🔵🟢 变蓝、变绿的都是「碱」——肥皂水、小苏打水<br>` +
    `🟣 还是紫色的就是「中性」——纯净水</small>`;
  winPanel.style.display = "flex";
  fanfare();
}

canvas.addEventListener("pointerdown", e => {
  if (winPanel.style.display === "flex" || anim) return;
  hintEl.style.opacity = "0";
  const x = e.clientX, y = e.clientY;
  // 先检查猜测卡按钮
  for (let i = 0; i < cups.length; i++) {
    if (cups[i].tested) continue;
    for (const r of cups[i].btnRects) {
      if (x >= r.x && x <= r.x + r.w && y >= r.y - 6 && y <= r.y + r.h + 6) {
        guessCup(i, r.g);
        return;
      }
    }
  }
  // 抓起滴管
  if (Math.hypot(x - dropper.x, y - (dropper.y + 56)) < 95) {
    dropper.dragging = true;
    dropper.lastX = x;
    dropper.x = x; dropper.y = y - DROPPER_LEN;
    canvas.setPointerCapture(e.pointerId);
    pop(760);
  }
});
canvas.addEventListener("pointermove", e => {
  if (!dropper.dragging) return;
  dropper.tilt = Math.max(-0.3, Math.min(0.3, (e.clientX - dropper.lastX) * 0.03));
  dropper.lastX = e.clientX;
  dropper.x = e.clientX;
  dropper.y = e.clientY - DROPPER_LEN;
});
window.addEventListener("pointerup", e => {
  if (!dropper.dragging) return;
  dropper.dragging = false;
  dropper.tilt = 0;
  const i = cupAt(dropper.x, dropper.y + DROPPER_LEN);
  if (i >= 0 && startDrop(i)) return;
  anim = { cup:null, phase:"back", t:0, fx:dropper.x, fy:dropper.y, drops:[], spawned:0 };
});

/* ================= 动画逻辑 ================= */
const DROP_TIMES = [0.15, 0.45, 0.75];

function burst(x, y) {
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 170;
    particles.push({ x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - 70, life:1, r:2.5 + Math.random() * 3 });
  }
}

function update(dt) {
  // 滴液动画状态机
  if (anim) {
    anim.t += dt;
    const c = anim.cup;
    if (anim.phase === "go") {
      const k = ease(Math.min(1, anim.t / 0.35));
      dropper.x = lerp(anim.fx, c.cx, k);
      dropper.y = lerp(anim.fy, c.top - DROPPER_LEN - 14, k);
      if (anim.t >= 0.35) { anim.phase = "squeeze"; anim.t = 0; }
    } else if (anim.phase === "squeeze") {
      // 挤压球泡：每滴一次压缩一下
      let s = 0;
      for (const tm of DROP_TIMES) {
        const l = (anim.t - tm) / 0.3;
        if (l > 0 && l < 1) s = Math.max(s, Math.sin(l * Math.PI));
      }
      dropper.squeeze = s;
      while (anim.spawned < DROP_TIMES.length && anim.t >= DROP_TIMES[anim.spawned]) {
        anim.spawned++;
        anim.drops.push({ x:dropper.x, y:dropper.y + DROPPER_LEN, vy:60 });
        pop(520 + Math.random() * 160);
      }
      const sy = surfaceY(c);
      for (const d of anim.drops) {
        d.vy += 1500 * dt;
        d.y += d.vy * dt;
        if (d.y >= sy + 6) {   // 落进液面：扩散开
          d.dead = true;
          c.mixing = true;
          c.blobs.push({ x:d.x, y:sy + 10, r:5 });
          drip();
        }
      }
      anim.drops = anim.drops.filter(d => !d.dead);
      if (anim.t > 1.15 && anim.drops.length === 0 && c.mix >= 1) {
        anim.phase = "back"; anim.t = 0;
        anim.fx = dropper.x; anim.fy = dropper.y;
        resolveDrop(c);
      }
    } else {  // back：滴管回家
      const k = ease(Math.min(1, anim.t / 0.4));
      dropper.x = lerp(anim.fx, dropper.hx, k);
      dropper.y = lerp(anim.fy, dropper.hy, k);
      dropper.squeeze *= 0.8;
      if (anim.t >= 0.4) { anim = null; dropper.squeeze = 0; dropper.x = dropper.hx; dropper.y = dropper.hy; }
    }
  }
  // 杯中颜色渐变 + 扩散圈
  for (const c of cups) {
    if (c.mixing && c.mix < 1) c.mix = Math.min(1, c.mix + dt / 2.0);
    for (const b of c.blobs) b.r += 120 * dt;
    c.blobs = c.blobs.filter(b => b.r < c.cw * 0.9);
    // 雪碧的气泡（把看不见的二氧化碳画出来）
    if (c.soda) {
      c.bubT += dt;
      if (c.bubT > 0.28 && c.bubbles.length < 14) {
        c.bubT = 0;
        c.bubbles.push({ x:c.cx + (Math.random() - 0.5) * c.bw * 0.7, y:c.top + c.ch * 0.88, r:1.5 + Math.random() * 2.2 });
      }
      const sy = surfaceY(c);
      for (const b of c.bubbles) b.y -= 34 * dt;
      c.bubbles = c.bubbles.filter(b => b.y > sy + 4);
    }
  }
  // 星星礼花
  for (const p of particles) {
    p.life -= dt / 0.9;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 320 * dt;
  }
  particles = particles.filter(p => p.life > 0);
}

/* ================= 绘制 ================= */
function roundRect(x, y, w, h, r, fill) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  if (fill) ctx.fill();
}

function liquidPath(c) {
  const sy = surfaceY(c), by = c.top + c.ch - 8;
  ctx.beginPath();
  ctx.moveTo(c.cx - cupHalfW(c, sy) + 4, sy);
  ctx.lineTo(c.cx - cupHalfW(c, by) + 5, by);
  ctx.quadraticCurveTo(c.cx, by + 7, c.cx + cupHalfW(c, by) - 5, by);
  ctx.lineTo(c.cx + cupHalfW(c, sy) - 4, sy);
  ctx.closePath();
}

function drawCup(c) {
  // 小木架
  ctx.fillStyle = "#c89a63";
  roundRect(c.cx - c.cw * 0.68, c.top + c.ch + 4, c.cw * 1.36, 14, 7, true);
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  roundRect(c.cx - c.cw * 0.68, c.top + c.ch + 14, c.cw * 1.36, 4, 2, true);
  // 悬停高亮
  if (dropper.dragging && !c.tested && pointInCup(dropper.x, dropper.y + DROPPER_LEN, c)) {
    ctx.save();
    ctx.strokeStyle = "rgba(255,200,60,0.9)"; ctx.lineWidth = 5;
    ctx.setLineDash([10, 8]);
    roundRect(c.cx - c.cw * 0.62, c.top - 12, c.cw * 1.24, c.ch + 22, 16, false);
    ctx.stroke();
    ctx.restore();
  }
  // 杯名标签
  ctx.font = "bold 16px 'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  const label = `${c.emoji} ${c.name}`;
  const lw = ctx.measureText(label).width + 18;
  roundRect(c.cx - lw / 2, c.top - 32, lw, 24, 12, true);
  ctx.fillStyle = "#5a4632";
  ctx.fillText(label, c.cx, c.top - 20);
  // 液体
  ctx.save();
  liquidPath(c);
  ctx.clip();
  ctx.fillStyle = mixColor(c.init, c.target, ease(c.mix));
  ctx.fillRect(c.cx - c.cw / 2, surfaceY(c), c.cw, c.ch);
  // 扩散圈（滴入处颜色晕开）
  for (const b of c.blobs) {
    const col = mixColor(INDICATOR, c.target, c.mix);
    const g = ctx.createRadialGradient(b.x, b.y, 1, b.x, b.y, b.r);
    g.addColorStop(0, col.replace("rgb", "rgba").replace(")", ",0.55)"));
    g.addColorStop(1, col.replace("rgb", "rgba").replace(")", ",0)"));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
  }
  // 雪碧气泡
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  for (const b of c.bubbles) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); }
  // 液面高光
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.fillRect(c.cx - c.cw / 2, surfaceY(c), c.cw, 3);
  ctx.restore();
  // 玻璃杯壁
  ctx.beginPath();
  ctx.moveTo(c.cx - c.cw / 2, c.top);
  ctx.lineTo(c.cx - c.bw / 2, c.top + c.ch - 6);
  ctx.quadraticCurveTo(c.cx, c.top + c.ch + 2, c.cx + c.bw / 2, c.top + c.ch - 6);
  ctx.lineTo(c.cx + c.cw / 2, c.top);
  ctx.strokeStyle = "rgba(120,140,160,0.8)"; ctx.lineWidth = 3;
  ctx.stroke();
  // 玻璃高光
  ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(c.cx - c.cw / 2 + 9, c.top + 12);
  ctx.lineTo(c.cx - c.bw / 2 + 10, c.top + c.ch * 0.6);
  ctx.stroke();
}

function drawCard(c) {
  const r0 = c.btnRects[0], r2 = c.btnRects[2];
  const cardX = r0.x - 8, cardY = r0.y - 7;
  const cardW = (r2.x + r2.w) - r0.x + 16, cardH = r0.h + 14;
  if (!c.tested) {
    // 猜测卡
    ctx.fillStyle = "rgba(255,252,245,0.95)";
    roundRect(cardX, cardY, cardW, cardH, 12, true);
    ctx.strokeStyle = "rgba(120,90,50,0.25)"; ctx.lineWidth = 2;
    roundRect(cardX, cardY, cardW, cardH, 12, false); ctx.stroke();
    ctx.font = "bold 17px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const r of c.btnRects) {
      const sel = c.guess === r.g;
      ctx.fillStyle = sel ? TYPE_COLOR[r.g] : "#efe6d5";
      roundRect(r.x, r.y, r.w, r.h, 10, true);
      ctx.strokeStyle = sel ? "rgba(0,0,0,0.3)" : "rgba(120,90,50,0.3)";
      ctx.lineWidth = sel ? 3 : 2;
      roundRect(r.x, r.y, r.w, r.h, 10, false); ctx.stroke();
      ctx.fillStyle = sel ? "#fff" : "#6a5a44";
      ctx.fillText(TYPE_TXT[r.g], r.x + r.w / 2, r.y + r.h / 2 + 1);
    }
  } else {
    // 揭晓卡
    const right = c.guess === c.type;
    ctx.fillStyle = TYPE_COLOR[c.type];
    roundRect(cardX, cardY, cardW, cardH, 12, true);
    ctx.font = "bold 16px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff";
    ctx.fillText(right ? `是${TYPE_TXT[c.type]}！⭐+1` : `其实是${TYPE_TXT[c.type]}哦`, cardX + cardW / 2, cardY + cardH / 2 + 1);
  }
}

function drawBottle() {
  const x = bottle.x, y = bottle.y;
  // 锥形瓶
  ctx.beginPath();
  ctx.moveTo(x - 13, y);
  ctx.lineTo(x - 13, y + 34);
  ctx.lineTo(x - 46, y + 100);
  ctx.quadraticCurveTo(x - 50, y + 112, x - 38, y + 112);
  ctx.lineTo(x + 38, y + 112);
  ctx.quadraticCurveTo(x + 50, y + 112, x + 46, y + 100);
  ctx.lineTo(x + 13, y + 34);
  ctx.lineTo(x + 13, y);
  ctx.strokeStyle = "rgba(120,140,160,0.85)"; ctx.lineWidth = 3;
  ctx.stroke();
  // 紫色指示剂
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x - 38, y + 62);
  ctx.lineTo(x - 46, y + 100);
  ctx.quadraticCurveTo(x - 50, y + 112, x - 38, y + 112);
  ctx.lineTo(x + 38, y + 112);
  ctx.quadraticCurveTo(x + 50, y + 112, x + 46, y + 100);
  ctx.lineTo(x + 38, y + 62);
  ctx.closePath();
  ctx.clip();
  ctx.fillStyle = INDICATOR;
  ctx.fillRect(x - 50, y + 62, 100, 55);
  ctx.fillStyle = "rgba(255,255,255,0.3)";
  ctx.fillRect(x - 50, y + 62, 100, 3);
  ctx.restore();
  // 标签
  ctx.font = "bold 15px 'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#5a3d78";
  ctx.fillText("紫甘蓝指示剂", x, rows === 1 ? y + 132 : y - 12);
}

function drawDropper() {
  const x = dropper.x, y = dropper.y;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(dropper.tilt);
  // 玻璃管
  ctx.fillStyle = "rgba(230,240,250,0.85)";
  roundRect(-7, 22, 14, DROPPER_LEN - 26, 6, true);
  ctx.strokeStyle = "rgba(120,140,160,0.8)"; ctx.lineWidth = 2;
  roundRect(-7, 22, 14, DROPPER_LEN - 26, 6, false); ctx.stroke();
  // 管内紫色液体
  ctx.fillStyle = INDICATOR;
  roundRect(-4.5, 48, 9, DROPPER_LEN - 56, 4, true);
  // 橡胶球泡（挤压时压扁变宽）
  const sq = dropper.squeeze;
  ctx.beginPath();
  ctx.ellipse(0, 12, 16 + sq * 4, 19 - sq * 6, 0, 0, 7);
  ctx.fillStyle = "#e05260"; ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.2)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(-5, 6, 5, 7, -0.4, 0, 7);
  ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.fill();
  ctx.restore();
  // 下落中的液滴
  if (anim && anim.drops) {
    ctx.fillStyle = INDICATOR;
    for (const d of anim.drops) {
      ctx.beginPath();
      ctx.ellipse(d.x, d.y, 4.5, 6.5, 0, 0, 7);
      ctx.fill();
    }
  }
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 背景：温暖的小厨房
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#fdf3e3");
  bg.addColorStop(1, "#f7e2c2");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  // 标题（窄屏时让位给 scorebar）
  if (W >= 700) {
    ctx.font = "bold 22px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign = "right"; ctx.textBaseline = "top";
    ctx.fillStyle = "rgba(122,75,168,0.85)";
    ctx.fillText("🧪 酸碱变色魔法", W - 18, 16);
  }
  for (const c of cups) drawCup(c);
  for (const c of cups) drawCard(c);
  drawBottle();
  drawDropper();
  // 星星礼花
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = "#ffd54a";
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ================= 音效 ================= */
let actx = null;
function tone(freq, dur, vol, type, freqEnd) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, actx.currentTime + dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + 0.02);
  } catch (e) {}
}
const pop = f => tone(f, 0.12, 0.12);
const drip = () => tone(850, 0.16, 0.1, "sine", 320);   // 水滴落
function chime() { [784, 1047].forEach((f, i) => setTimeout(() => pop(f), i * 110)); }
function fanfare() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => pop(f), i * 130)); }

/* ================= 主循环 ================= */
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - lastT) / 1000);
  lastT = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ================= 其它 ================= */
let hintTimer = null;
function showHint(text) {
  hintEl.textContent = text;
  hintEl.style.opacity = "1";
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { hintEl.style.opacity = "0"; }, 2600);
}
hintEl.addEventListener("click", () => { hintEl.style.opacity = "0"; });
document.getElementById("replayBtn").addEventListener("click", () => { resetGame(); pop(880); });

// 测试钩子（不影响游戏）
window.__lab = {
  get cups() { return cups; },
  guessCup, startDrop,
  busy: () => !!anim,
  step: dt => { update(dt); draw(); },
  state: () => ({ stars, testedCount })
};

resize();
resetGame();
requestAnimationFrame(loop);
</script>
