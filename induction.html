<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>电磁感应发电</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#16222e; }
  #stage { position:absolute; inset:0; touch-action:none; display:block; }
  #scorebar {
    position:absolute; top:12px; left:50%; transform:translateX(-50%);
    background:rgba(10,20,30,0.85); color:#ffd54a; padding:10px 22px;
    border-radius:24px; font-size:18px; font-weight:bold; z-index:10;
    pointer-events:none; white-space:nowrap;
  }
  #hint {
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    background:rgba(10,20,30,0.85); color:#fff; padding:9px 20px;
    border-radius:24px; font-size:15px; z-index:10; pointer-events:none;
    transition:opacity 0.6s; white-space:nowrap;
  }
  #lawPanel {
    position:absolute; top:64px; left:14px; z-index:10; pointer-events:none;
    background:rgba(10,20,30,0.78); color:#dcebf5; border-radius:14px;
    padding:12px 16px; font-size:14px; line-height:1.75; max-width:300px;
    border:1px solid rgba(120,180,220,0.25);
  }
  #lawPanel .t { font-size:15px; font-weight:bold; color:#8fd3ff; margin-bottom:4px; }
  #lawPanel .f { color:#ffd54a; font-weight:bold; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="scorebar">💡 亮度档位 0 / 5 · 目标：冲到 5 档！</div>
<div id="lawPanel">
  <div class="t">法拉第电磁感应定律</div>
  🧲 磁铁不动 → 无电流<br>
  ⚡ 动得越快 → 电流越大<br>
  ↔️ 运动方向变 → 电流方向变<br>
  <span class="f">ε = −ΔΦ/Δt</span>
</div>
<div id="hint">点住条形磁铁左右拖动：穿过线圈发电，快速摇动让灯泡冲到最亮档！</div>

<script>
"use strict";
/* ================= 基础 ================= */
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const scorebar = document.getElementById("scorebar");
const hintEl = document.getElementById("hint");
let W = 0, H = 0, DPR = 1;

/* ================= 场景数据 ================= */
// 布局（resize 时按窗口比例计算，单位 CSS 像素）
const L = {
  coil: { x:0, y:0, r:62, loops:7, gap:11, rx:13 },  // 线圈（侧视，轴线水平）
  mag:  { len:124, h:46 },                            // 条形磁铁
  track:{ minX:0, maxX:0, y:0 },                      // 磁铁可拖动的水平轨道
  gauge:{ x:0, y:0, r:64 },                           // 电流表
  bulb: { x:0, y:0, r:34 },                           // 小灯泡
  graph:{ x:0, y:0, w:0, h:150 },                     // Φ/I 滚动曲线图
};
function layout() {
  L.coil.x = W * 0.30; L.coil.y = H * 0.40;
  L.track.y = L.coil.y;
  L.track.minX = 40 + L.mag.len / 2;
  L.track.maxX = W * 0.64;
  L.gauge.x = W * 0.82; L.gauge.y = H * 0.64;
  L.bulb.x  = W * 0.82; L.bulb.y  = H * 0.20;
  L.graph.x = 24; L.graph.y = H - 196;
  L.graph.w = Math.min(W * 0.52, 600); L.graph.h = 150;
  L.graph.x2 = L.graph.x + L.graph.w;
}
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  layout();
  mag.x = Math.max(L.track.minX, Math.min(L.track.maxX, mag.x));
}
window.addEventListener("resize", resize);

/* ================= 游戏状态 ================= */
const mag = { x:0, vx:0 };          // 磁铁位置与（松手后的）惯性速度
let dragging = false, dragX = 0;    // 拖拽目标位置
let prevX = 0, vxS = 0;             // 平滑后的磁铁速度
let phi = 0, current = 0, currentS = 0; // 磁通量(归一)、感应电流(归一)、平滑电流
let needleA = 0;                    // 电流表指针角（弹性跟随）
let level = 0;                      // 灯泡亮度档 0-5
let won = false, armed = true;      // 庆祝只在新一次冲顶时触发
let simT = 0;                       // 模拟时钟（秒）
let lastSign = 0;                   // 电流方向（用于换向提示音）
let hist = [];                      // {t, phi, i} 历史曲线
let sparks = [];                    // 庆祝火花
let wireQ = 0;                      // 导线上“电荷”流动的累积相位

const SIGMA = 92;                   // 磁通分布宽度（px）
const I_REF = 6;                    // 归一化电流参考（≈快速摇动时的 |dΦ/dt|）
const GRAPH_SPAN = 8;               // 曲线图时间跨度（秒）

function resetScene() {
  resize();
  mag.x = L.track.minX + 60; mag.vx = 0;
  prevX = mag.x; vxS = 0;
  phi = fluxAt(mag.x); current = 0; currentS = 0;
  needleA = 0; level = 0; won = false; armed = true;
  hist = []; sparks = []; wireQ = 0; lastSign = 0;
  updateScore();
}
function updateScore() {
  scorebar.textContent = `💡 亮度档位 ${level} / 5` +
    (won ? " · ✅ 最亮档已达成！" : " · 目标：冲到 5 档！");
}
// 穿过线圈的磁通量（归一）：磁铁越靠近线圈中心，穿过的磁感线越多
function fluxAt(x) {
  const dx = x - L.coil.x;
  return Math.exp(-dx * dx / (2 * SIGMA * SIGMA));
}

/* ================= 物理 ================= */
// 感应电流 I = -dΦ/dt：Φ=e^{-dx²/2σ²} → I ∝ Φ·dx·v，方向随运动方向改变
function frame(dt) {
  simT += dt;
  // 磁铁运动：拖拽跟随 / 松手后惯性滑行（摩擦减速、端点回弹）
  if (dragging) {
    mag.x = Math.max(L.track.minX, Math.min(L.track.maxX, dragX));
    mag.vx = 0;
  } else if (mag.vx !== 0) {
    mag.x += mag.vx * dt;
    const fr = 1600 * dt;
    mag.vx = Math.abs(mag.vx) <= fr ? 0 : mag.vx - Math.sign(mag.vx) * fr;
    if (mag.x < L.track.minX) { mag.x = L.track.minX; mag.vx *= -0.45; }
    if (mag.x > L.track.maxX) { mag.x = L.track.maxX; mag.vx *= -0.45; }
  }
  // 由位置差分测速度（拖动快慢即磁铁速度），低通平滑防抖
  const vxI = dt > 0 ? (mag.x - prevX) / dt : 0;
  prevX = mag.x;
  vxS += (vxI - vxS) * (1 - Math.exp(-dt / 0.025));

  const dx = mag.x - L.coil.x;
  phi = fluxAt(mag.x);
  current = phi * dx * vxS / (SIGMA * SIGMA) / I_REF;   // = -dΦ/dt（楞次定律取号）
  currentS += (current - currentS) * (1 - Math.exp(-dt / 0.035));
  wireQ += currentS * dt * 90;

  // 电流表指针：带阻尼的弹簧跟随
  const target = Math.max(-1, Math.min(1, currentS)) * 1.05;
  needleA += (target - needleA) * (1 - Math.exp(-dt / 0.08));

  // 电流换向提示音
  const s = Math.abs(currentS) > 0.12 ? Math.sign(currentS) : 0;
  if (s !== 0 && lastSign !== 0 && s !== lastSign) pop(s > 0 ? 620 : 420, 0.05);
  if (s !== 0) lastSign = s;

  // 灯泡亮度档位
  const b = Math.min(1, Math.abs(currentS));
  const nl = b <= 0.03 ? 0 : Math.min(5, Math.ceil(b * 5));
  if (nl !== level) { level = nl; updateScore(); }
  if (level === 5 && armed) {
    armed = false; won = true;
    updateScore(); fanfare();
    showHint("🎉 最亮档达成！感应电流全靠一个“快”字！");
    burst(L.bulb.x, L.bulb.y);
  }
  if (level <= 2) armed = true;

  // 历史曲线（滚动图）
  hist.push({ t: simT, phi, i: Math.max(-1.2, Math.min(1.2, currentS)) });
  while (hist.length && hist[0].t < simT - GRAPH_SPAN) hist.shift();

  // 火花粒子
  for (const p of sparks) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 320 * dt; p.life -= dt;
  }
  sparks = sparks.filter(p => p.life > 0);
}
function burst(x, y) {
  for (let i = 0; i < 36; i++) {
    const a = Math.random() * Math.PI * 2, sp = 90 + Math.random() * 260;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120,
      life: 0.7 + Math.random() * 0.7, c: ["#ffd54a", "#ff8a65", "#8fd3ff", "#fff"][i % 4] });
  }
}

/* ================= 绘制 ================= */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#1b2c3c"); g.addColorStop(1, "#101a24");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 磁铁轨道虚线
  ctx.strokeStyle = "rgba(160,200,230,0.18)"; ctx.lineWidth = 3;
  ctx.setLineDash([10, 12]);
  ctx.beginPath(); ctx.moveTo(L.track.minX - 60, L.track.y);
  ctx.lineTo(L.track.maxX + 60, L.track.y); ctx.stroke();
  ctx.setLineDash([]);
}

// 磁铁的磁感线：靠近线圈的部分高亮，表现“穿过线圈的磁通量”
function drawFieldLines() {
  const cx = mag.x, cy = L.track.y, hl = L.mag.len / 2;
  ctx.save();
  for (let i = 0; i < 4; i++) {
    const a = hl + 22 + i * 26, b = 30 + i * 22;
    // 该簇磁感线穿过线圈的强度 ∝ Φ
    const glow = 0.16 + 0.55 * phi * (1 - i * 0.16);
    ctx.strokeStyle = `rgba(120,200,255,${glow.toFixed(3)})`;
    ctx.lineWidth = 2 + phi * 1.5;
    ctx.beginPath(); ctx.ellipse(cx, cy, a, b, 0, 0, Math.PI * 2); ctx.stroke();
    // 外部磁感线方向：N → S（N 在右，故上方箭头向左）
    const ax = cx, ay = cy - b;
    ctx.fillStyle = `rgba(120,200,255,${(glow + 0.15).toFixed(3)})`;
    ctx.beginPath();
    ctx.moveTo(ax - 8, ay); ctx.lineTo(ax + 4, ay - 5); ctx.lineTo(ax + 4, ay + 5);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// 线圈：先画后半圈，磁铁从中穿过，再画前半圈挡住磁铁
function coilLoopX(i) { return L.coil.x + (i - (L.coil.loops - 1) / 2) * L.coil.gap; }
function drawCoil(backHalf) {
  const { y, r, loops, rx } = L.coil;
  ctx.save();
  ctx.strokeStyle = "#e8a13c"; ctx.lineWidth = 4.5;
  ctx.lineCap = "round";
  for (let i = 0; i < loops; i++) {
    const x = coilLoopX(i);
    ctx.beginPath();
    if (backHalf) ctx.ellipse(x, y, rx, r, 0, Math.PI, Math.PI * 2);   // 上半（磁铁后方）
    else ctx.ellipse(x, y, rx, r, 0, 0, Math.PI);                       // 下半（挡在磁铁前）
    ctx.stroke();
  }
  ctx.restore();
}

function drawMagnet() {
  const x = mag.x, y = L.track.y, hl = L.mag.len / 2, hh = L.mag.h / 2;
  ctx.save();
  ctx.translate(x, y);
  // 拖拽抓手提示：磁铁微放大
  if (dragging) ctx.scale(1.05, 1.05);
  // S 极（左，蓝）/ N 极（右，红）
  ctx.fillStyle = "#3a6fd8"; roundRectPath(-hl, -hh, hl, L.mag.h, 8); ctx.fill();
  ctx.fillStyle = "#e0483e"; roundRectPath(0, -hh, hl, L.mag.h, 8); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.4)"; ctx.lineWidth = 2.5;
  roundRectPath(-hl, -hh, L.mag.len, L.mag.h, 8); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "bold 20px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("S", -hl / 2, 1);
  ctx.fillText("N", hl / 2, 1);
  // 高光
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  roundRectPath(-hl + 5, -hh + 4, L.mag.len - 10, 9, 4); ctx.fill();
  ctx.restore();
}

// 闭合回路：线圈 → 电流表 → 灯泡 → 回到线圈，线上流动的小点表示电流
function circuitPath() {
  const c = L.coil, g = L.gauge, b = L.bulb;
  const x0 = coilLoopX(0), x1 = coilLoopX(L.coil.loops - 1);
  return [
    [x0, c.y + c.r], [x0, g.y], [g.x - g.r - 4, g.y],          // 下线 → 电流表左端
    [g.x + g.r + 4, g.y], [g.x + g.r + 4, b.y], [b.x + 20, b.y], // 电流表右端 → 灯泡
    [b.x - 20, b.y], [x1, b.y], [x1, c.y - c.r],               // 灯泡 → 回线圈顶端
  ];
}
function drawCircuit() {
  const pts = circuitPath();
  ctx.save();
  ctx.strokeStyle = "#b8c4cc"; ctx.lineWidth = 4; ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  // 电流表左半进、右半出（表盘盖住中段）
  ctx.lineTo(pts[1][0], pts[1][1]); ctx.lineTo(pts[2][0], pts[2][1]);
  ctx.moveTo(pts[3][0], pts[3][1]);
  for (let i = 4; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
  // 电流小点：方向与速度随感应电流变化
  const speed = currentS;
  if (Math.abs(speed) > 0.02) {
    const seg = [];
    let total = 0;
    const chain = [pts[0], pts[1], pts[2], pts[3], pts[4], pts[5], pts[6], pts[7], pts[8]];
    for (let i = 0; i < chain.length - 1; i++) {
      const d = Math.hypot(chain[i + 1][0] - chain[i][0], chain[i + 1][1] - chain[i][1]);
      seg.push(d); total += d;
    }
    const spacing = 46, nDot = Math.floor(total / spacing);
    const off = ((wireQ * Math.sign(speed)) % spacing + spacing) % spacing;
    ctx.fillStyle = "#ffe082";
    for (let k = 0; k < nDot; k++) {
      let d = (k * spacing + off) % total;
      let i = 0;
      while (i < seg.length - 1 && d > seg[i]) { d -= seg[i]; i++; }
      const t = seg[i] ? d / seg[i] : 0;
      const px = chain[i][0] + (chain[i + 1][0] - chain[i][0]) * t;
      const py = chain[i][1] + (chain[i + 1][1] - chain[i][1]) * t;
      const r = 3 + 2.5 * Math.min(1, Math.abs(speed));
      ctx.globalAlpha = 0.35 + 0.65 * Math.min(1, Math.abs(speed));
      ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawGauge() {
  const { x, y, r } = L.gauge;
  ctx.save();
  ctx.translate(x, y);
  // 表盘
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = "#f4f1e8"; ctx.fill();
  ctx.strokeStyle = "#5a6672"; ctx.lineWidth = 5; ctx.stroke();
  // 刻度弧（中央为零，左负右正）
  ctx.strokeStyle = "#5a6672"; ctx.lineWidth = 2;
  for (let i = -4; i <= 4; i++) {
    const a = -Math.PI / 2 + i * (1.05 / 4);
    const r1 = r - 14, r2 = r - (i % 2 === 0 ? 24 : 19);
    ctx.beginPath();
    ctx.moveTo(Math.sin(a) * r1, -Math.cos(a) * r1);
    ctx.lineTo(Math.sin(a) * r2, -Math.cos(a) * r2);
    ctx.stroke();
  }
  ctx.fillStyle = "#5a6672"; ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("−", -r + 22, -12);
  ctx.fillText("0", 0, -r + 22);
  ctx.fillText("+", r - 22, -12);
  ctx.font = "13px sans-serif";
  ctx.fillText("感应电流 I", 0, 24);
  // 指针：方向随磁铁运动方向左右摆动
  const swing = needleA;
  ctx.strokeStyle = "#d43a2f"; ctx.lineWidth = 3.5; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-Math.sin(swing) * 10, Math.cos(swing) * 10);
  ctx.lineTo(Math.sin(swing) * (r - 26), -Math.cos(swing) * (r - 26));
  ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2);
  ctx.fillStyle = "#37424c"; ctx.fill();
  ctx.restore();
}

function drawBulb() {
  const { x, y, r } = L.bulb;
  const b = Math.min(1, Math.abs(currentS));
  ctx.save();
  ctx.translate(x, y);
  // 光晕
  if (b > 0.02) {
    const g = ctx.createRadialGradient(0, 0, r * 0.3, 0, 0, r * (2 + b * 2.2));
    g.addColorStop(0, `rgba(255,220,110,${0.5 * b})`);
    g.addColorStop(1, "rgba(255,220,110,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r * (2 + b * 2.2), 0, Math.PI * 2); ctx.fill();
  }
  // 玻璃泡
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = b > 0.02
    ? `rgba(255,${205 + Math.floor(40 * b)},${90 + Math.floor(60 * b)},${0.35 + 0.6 * b})`
    : "rgba(200,215,225,0.25)";
  ctx.fill();
  ctx.strokeStyle = "rgba(220,235,245,0.7)"; ctx.lineWidth = 2.5; ctx.stroke();
  // 灯丝
  ctx.strokeStyle = b > 0.02 ? "#fff3c0" : "#8a949c"; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-14, r * 0.45);
  for (let i = 0; i <= 6; i++)
    ctx.lineTo(-14 + (28 / 6) * i, r * 0.1 + (i % 2 === 0 ? 0 : -8));
  ctx.lineTo(14, r * 0.45);
  ctx.stroke();
  // 灯头
  ctx.fillStyle = "#93a1ac";
  ctx.fillRect(-13, r - 2, 26, 16);
  ctx.fillStyle = "#6e7b86";
  ctx.fillRect(-13, r + 3, 26, 3); ctx.fillRect(-13, r + 9, 26, 3);
  ctx.restore();
  // 引线与导线衔接
  ctx.strokeStyle = "#b8c4cc"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x - 20, y); ctx.lineTo(x - 10, y + r + 8);
  ctx.moveTo(x + 20, y); ctx.lineTo(x + 10, y + r + 8); ctx.stroke();
}

// Φ / I 滚动曲线图
function drawGraph() {
  const g = L.graph;
  ctx.save();
  ctx.fillStyle = "rgba(8,16,24,0.82)";
  roundRectPath(g.x, g.y, g.w, g.h, 12); ctx.fill();
  ctx.strokeStyle = "rgba(120,180,220,0.3)"; ctx.lineWidth = 1.5; ctx.stroke();
  const pad = 30, x0 = g.x + pad, x1 = g.x + g.w - 10;
  const y0 = g.y + 26, y1 = g.y + g.h - 14, ym = (y0 + y1) / 2;
  // 零线与边框
  ctx.strokeStyle = "rgba(160,190,210,0.35)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0, ym); ctx.lineTo(x1, ym); ctx.stroke();
  ctx.strokeStyle = "rgba(160,190,210,0.2)";
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.stroke();
  // 标题与图例
  ctx.font = "bold 13px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#8fd3ff"; ctx.fillText("磁通量 Φ", g.x + 12, g.y + 13);
  ctx.fillStyle = "#ffb74d"; ctx.fillText("感应电流 I", g.x + 92, g.y + 13);
  ctx.fillStyle = "rgba(200,220,235,0.6)"; ctx.font = "11px sans-serif";
  ctx.textAlign = "right"; ctx.fillText(`${GRAPH_SPAN} 秒滚动 →`, g.x + g.w - 10, g.y + 13);
  if (hist.length > 1) {
    const pxPerS = (x1 - x0) / GRAPH_SPAN;
    const plot = (key, color, amp) => {
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
      let started = false;
      for (const p of hist) {
        const px = x1 - (simT - p.t) * pxPerS;
        if (px < x0) continue;
        const py = ym - p[key] * amp;
        if (!started) { ctx.moveTo(px, py); started = true; }
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
    };
    plot("phi", "#4dd0e1", (y1 - y0) / 2 * 0.85);   // Φ：0..1，画在零线上方
    plot("i", "#ffb300", (y1 - y0) / 2 * 0.85);     // I：-1..1，过零摆动
  }
  ctx.restore();
}

function drawSparks() {
  for (const p of sparks) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground();
  drawFieldLines();
  drawCircuit();
  drawCoil(true);     // 线圈后半
  drawMagnet();       // 磁铁穿在线圈中
  drawCoil(false);    // 线圈前半挡住磁铁
  drawGauge();
  drawBulb();
  drawGraph();
  drawSparks();
  // 拖动提示箭头（未拖过时，磁铁两侧呼吸箭头）
  if (!everDragged) {
    const a = (Math.sin(simT * 4) + 1) / 2;
    ctx.fillStyle = `rgba(255,213,74,${0.35 + 0.45 * a})`;
    ctx.font = "bold 26px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("◀", mag.x - L.mag.len / 2 - 30, L.track.y);
    ctx.fillText("▶", mag.x + L.mag.len / 2 + 30, L.track.y);
  }
}

/* ================= 交互 ================= */
let everDragged = false;
function onMagnet(e) {
  return Math.abs(e.clientX - mag.x) < L.mag.len / 2 + 14 &&
         Math.abs(e.clientY - L.track.y) < L.mag.h / 2 + 16;
}
canvas.addEventListener("pointerdown", e => {
  hintEl.style.opacity = "0";
  if (onMagnet(e)) {
    dragging = true;
    dragX = e.clientX;
    everDragged = true;
    canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor = "grabbing";
    pop(700, 0.06);
  }
});
canvas.addEventListener("pointermove", e => {
  if (dragging) dragX = e.clientX;
  else canvas.style.cursor = onMagnet(e) ? "grab" : "default";
});
window.addEventListener("pointerup", () => {
  if (!dragging) return;
  dragging = false;
  mag.vx = vxS;              // 松手带惯性：快甩可以把磁铁“扔”过线圈
  canvas.style.cursor = "default";
  if (Math.abs(vxS) > 600) whoosh(Math.min(1, Math.abs(vxS) / 2500));
});

/* ================= 音效 ================= */
let actx = null;
function tone(freq, dur, vol, type) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + 0.02);
  } catch (e) {}
}
const pop = (f, d) => tone(f, d || 0.15, 0.14);
const whoosh = p => tone(240 + 420 * p, 0.16, 0.1, "triangle");
function fanfare() { [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => pop(f), i * 120)); }

/* ================= 主循环 ================= */
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - lastT) / 1000);
  lastT = now;
  frame(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ================= 其它 ================= */
let hintTimer = null;
function showHint(text) {
  hintEl.textContent = text;
  hintEl.style.opacity = "1";
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { hintEl.style.opacity = "0"; }, 2600);
}

resetScene();
requestAnimationFrame(loop);
</script>
