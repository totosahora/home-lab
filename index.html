<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>小小科学乐园</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; min-height:100%; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  body {
    background:linear-gradient(160deg,#3a7bd5 0%,#6a5ae0 45%,#a05ae0 100%);
    display:flex; flex-direction:column; align-items:center;
    padding:32px 20px 60px;
  }
  h1 { color:#fff; font-size:40px; margin-bottom:6px; text-shadow:0 3px 8px rgba(0,0,0,0.3); }
  .sub { color:rgba(255,255,255,0.85); font-size:16px; margin-bottom:22px; }
  .filters {
    display:flex; flex-wrap:wrap; gap:10px; justify-content:center;
    margin-bottom:26px; max-width:1100px;
  }
  .fbtn {
    border:none; border-radius:22px; padding:9px 20px;
    font-size:15px; font-weight:bold; cursor:pointer;
    background:rgba(255,255,255,0.25); color:#fff;
    transition:background 0.15s, transform 0.1s;
  }
  .fbtn:active { transform:scale(0.95); }
  .fbtn.active { background:#ffd54a; color:#5a3d00; }
  .fsep { width:2px; background:rgba(255,255,255,0.3); border-radius:2px; margin:4px 4px; }
  .count { color:rgba(255,255,255,0.75); font-size:14px; margin-bottom:16px; }
  .grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 230px));
    gap:18px; justify-content:center; max-width:1200px;
  }
  .card {
    background:#fff; border-radius:20px; padding:20px 16px 16px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    text-decoration:none; color:#333; position:relative;
    box-shadow:0 6px 16px rgba(0,0,0,0.22);
    transition:transform 0.15s, box-shadow 0.15s;
    cursor:pointer; user-select:none;
  }
  .card:hover { transform:translateY(-5px) scale(1.03); box-shadow:0 12px 24px rgba(0,0,0,0.3); }
  .card:active { transform:scale(0.97); }
  .card.todo { opacity:0.55; filter:grayscale(0.5); cursor:default; }
  .card.todo:hover { transform:none; box-shadow:0 6px 16px rgba(0,0,0,0.22); }
  .card .icon { font-size:46px; line-height:1.2; }
  .card .name { font-size:17px; font-weight:bold; text-align:center; }
  .card .desc { font-size:12px; color:#888; text-align:center; line-height:1.4; }
  .badges { display:flex; gap:6px; }
  .badge {
    font-size:11px; font-weight:bold; padding:3px 10px; border-radius:12px; color:#fff;
  }
  .b-phys { background:#2f7fe9; } .b-chem { background:#2fbf4a; } .b-math { background:#ff8f00; }
  .b-grade { background:#9b3de0; }
  .soon {
    position:absolute; top:10px; right:10px; font-size:11px; font-weight:bold;
    color:#999; background:#eee; padding:3px 8px; border-radius:10px;
  }
  .fav {
    position:absolute; top:8px; left:8px; font-size:20px; z-index:2;
    background:none; border:none; cursor:pointer; opacity:0.35;
    transition:transform 0.15s, opacity 0.15s;
  }
  .fav:hover { transform:scale(1.3); opacity:0.8; }
  .fav.on { opacity:1; }
  .played {
    position:absolute; top:10px; right:10px; font-size:11px; font-weight:bold;
    color:#2fbf4a; background:#e3f7e8; padding:3px 8px; border-radius:10px;
  }
  .en-toggle {
    margin-top:2px; border:1.5px solid #c5b8f0; background:#f6f2ff; color:#6a5ae0;
    border-radius:12px; padding:3px 12px; font-size:12px; font-weight:bold; cursor:pointer;
  }
  .en-toggle:hover { background:#ece5ff; }
  .en-box {
    display:none; margin-top:8px; padding:10px 12px; border-radius:12px;
    background:#f6f2ff; border:1.5px solid #e2d8ff; text-align:left;
  }
  .en-box.open { display:block; }
  .en-title { font-size:13px; font-weight:bold; color:#5a4ac0; margin-bottom:4px; }
  .en-concept { font-size:12px; color:#444; line-height:1.5; margin-bottom:6px; }
  .en-plain { font-size:12px; color:#7a6aa0; line-height:1.5; font-style:italic; }
</style>
</head>
<body>
<h1>🎡 小小科学乐园</h1>
<div class="sub">100 个物理 · 化学 · 数学小游戏，边玩边学！</div>
<div class="filters" id="filters"></div>
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>

<script src="games.js"></script>
<script src="games-en.js"></script>
<script>
"use strict";
const SUBJECTS = ["全部", "物理", "化学", "数学"];
const GRADES = ["全部", "5-8", "9-11", "12-14", "15-18"];
const GRADE_LABEL = { "5-8":"5-8岁", "9-11":"9-11岁", "12-14":"12-14岁", "15-18":"15-18岁" };
const SUBJ_CLASS = { "物理":"b-phys", "化学":"b-chem", "数学":"b-math" };
let curSubject = "全部", curGrade = "全部", curFav = false;

const filtersEl = document.getElementById("filters");
const gridEl = document.getElementById("grid");
const countEl = document.getElementById("count");

/* 本地进度：试玩记录 + 收藏 */
function loadJSON(k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (e) { return {}; } }
function getPlayed() { return loadJSON("lab-played"); }
function getFavs() { return loadJSON("lab-favs"); }
function toggleFav(id) {
  const f = getFavs();
  if (f[id]) delete f[id]; else f[id] = Date.now();
  try { localStorage.setItem("lab-favs", JSON.stringify(f)); } catch (e) {}
  render();
}

function buildFilters() {
  filtersEl.innerHTML = "";
  SUBJECTS.forEach(s => {
    const b = document.createElement("button");
    b.className = "fbtn" + (s === curSubject ? " active" : "");
    b.textContent = s;
    b.onclick = () => { curSubject = s; render(); };
    filtersEl.appendChild(b);
  });
  const sep = document.createElement("div");
  sep.className = "fsep";
  filtersEl.appendChild(sep);
  GRADES.forEach(g => {
    const b = document.createElement("button");
    b.className = "fbtn" + (g === curGrade ? " active" : "");
    b.textContent = g === "全部" ? "全年龄" : GRADE_LABEL[g];
    b.onclick = () => { curGrade = g; render(); };
    filtersEl.appendChild(b);
  });
  const sep2 = document.createElement("div");
  sep2.className = "fsep";
  filtersEl.appendChild(sep2);
  const fb = document.createElement("button");
  fb.className = "fbtn" + (curFav ? " active" : "");
  fb.textContent = "⭐ 收藏";
  fb.onclick = () => { curFav = !curFav; render(); };
  filtersEl.appendChild(fb);
}

function render() {
  buildFilters();
  const played = getPlayed(), favs = getFavs();
  let list = GAMES.filter(g =>
    (curSubject === "全部" || g.subject === curSubject) &&
    (curGrade === "全部" || g.grade === curGrade) &&
    (!curFav || favs[g.id]));
  // 收藏优先，其次最近玩过，其余按目录顺序
  list = list.slice().sort((a, b) => {
    const fa = favs[a.id] ? 1 : 0, fb2 = favs[b.id] ? 1 : 0;
    if (fa !== fb2) return fb2 - fa;
    const pa = played[a.file] || 0, pb = played[b.file] || 0;
    if (pa !== pb) return pb - pa;
    return 0;
  });
  const done = list.filter(g => g.status === "done").length;
  const playedCount = list.filter(g => played[g.file]).length;
  countEl.textContent = `共 ${list.length} 个游戏 · 已完成 ${done} 个 · 已玩过 ${playedCount} 个`;
  gridEl.innerHTML = "";
  for (const g of list) {
    const card = document.createElement(g.status === "done" ? "a" : "div");
    card.className = "card" + (g.status === "done" ? "" : " todo");
    if (g.status === "done") card.href = g.file;
    let corner;
    if (g.status !== "done") corner = '<div class="soon">敬请期待</div>';
    else if (played[g.file]) corner = '<div class="played">✓ 玩过</div>';
    else corner = "";
    card.innerHTML =
      `<button class="fav${favs[g.id] ? " on" : ""}" data-fav="${g.id}">${favs[g.id] ? "⭐" : "☆"}</button>` +
      corner +
      `<div class="icon">${g.icon}</div>` +
      `<div class="name">${g.title}</div>` +
      `<div class="desc">${g.desc}</div>` +
      `<div class="badges"><span class="badge ${SUBJ_CLASS[g.subject]}">${g.subject}</span>` +
      `<span class="badge b-grade">${GRADE_LABEL[g.grade]}</span></div>`;
    // 英文介绍（默认折叠）
    const en = (typeof GAMES_EN !== "undefined") ? GAMES_EN[g.id] : null;
    if (en) {
      card.innerHTML +=
        `<button class="en-toggle" data-en="${g.id}">📖 English</button>` +
        `<div class="en-box" id="en-${g.id}">` +
        `<div class="en-title">${en.title}</div>` +
        `<div class="en-concept">${en.concept}</div>` +
        `<div class="en-plain">${en.plain}</div>` +
        `</div>`;
    }
    gridEl.appendChild(card);
  }
  gridEl.querySelectorAll("[data-en]").forEach(btn => {
    btn.addEventListener("click", e => {
      e.preventDefault();
      e.stopPropagation();
      const box = document.getElementById("en-" + btn.dataset.en);
      const open = box.classList.toggle("open");
      btn.textContent = open ? "📖 收起" : "📖 English";
    });
  });
  gridEl.querySelectorAll("[data-fav]").forEach(btn => {
    btn.addEventListener("click", e => {
      e.preventDefault();
      e.stopPropagation();
      toggleFav(btn.dataset.fav);
    });
  });
}
render();
</script>
</body>
</html>
